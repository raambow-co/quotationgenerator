<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#172a45"/>
      <stop offset="100%" stop-color="#0b1b33"/>
    </linearGradient>

    <!-- Solar Cell Gradient (Monocrystalline Dark Blue) -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122544"/>
      <stop offset="35%" stop-color="#0c1e38"/>
      <stop offset="70%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>

    <!-- Aluminum Frame Metallic Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glass Reflection Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Cell Grid Pattern -->
    <pattern id="busbars" width="60" height="42" patternUnits="userSpaceOnUse">
      <rect width="58" height="40" rx="2" fill="url(#cellGrad)" stroke="#1e3a5f" stroke-width="0.8"/>
      <!-- Multi-Busbar Silver Lines (16BB) -->
      <line x1="3.6" y1="0" x2="3.6" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="7.2" y1="0" x2="7.2" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="10.8" y1="0" x2="10.8" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="14.5" y1="0" x2="14.5" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="18.1" y1="0" x2="18.1" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="21.7" y1="0" x2="21.7" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="25.4" y1="0" x2="25.4" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="29.0" y1="0" x2="29.0" y2="40" stroke="#cbd5e1" stroke-width="0.6" opacity="0.85"/>
      <line x1="32.6" y1="0" x2="32.6" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="36.2" y1="0" x2="36.2" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="39.9" y1="0" x2="39.9" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="43.5" y1="0" x2="43.5" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="47.1" y1="0" x2="47.1" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="50.8" y1="0" x2="50.8" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
      <line x1="54.4" y1="0" x2="54.4" y2="40" stroke="#94a3b8" stroke-width="0.35" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>

  <!-- Perspective Floor Shadow -->
  <ellipse cx="300" cy="365" rx="240" ry="18" fill="#000000" opacity="0.5" filter="blur(6px)"/>

  <!-- Solar PV Panel Outer Aluminum Anodized Frame -->
  <g transform="translate(65, 30)">
    <!-- Outer Bevel Frame -->
    <rect x="0" y="0" width="470" height="320" rx="8" fill="url(#frameGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Inner Dark Recess -->
    <rect x="12" y="12" width="446" height="296" rx="4" fill="#030712"/>

    <!-- Solar Cell Matrix (144 Half-Cut Cells Representation) -->
    <rect x="16" y="16" width="438" height="288" rx="2" fill="url(#busbars)"/>

    <!-- Center Module Split Gap (Twin/Half-Cut Design) -->
    <line x1="16" y1="160" x2="454" y2="160" stroke="#f1f5f9" stroke-width="2.5" opacity="0.9"/>
    <rect x="215" y="152" width="40" height="16" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Central Bypass Diode Junction Indication -->
    <circle cx="227" cy="160" r="3" fill="#e2e8f0"/>
    <circle cx="243" cy="160" r="3" fill="#e2e8f0"/>

    <!-- Glass Surface Anti-Reflective Sheen -->
    <polygon points="16,16 280,16 120,304 16,304" fill="url(#glassSheen)"/>
    <polygon points="320,16 454,16 454,200 240,304 200,304" fill="url(#glassSheen)" opacity="0.6"/>

    <!-- Frame Corner Fasteners -->
    <circle cx="6" cy="6" r="2.5" fill="#475569"/>
    <circle cx="464" cy="6" r="2.5" fill="#475569"/>
    <circle cx="6" cy="314" r="2.5" fill="#475569"/>
    <circle cx="464" cy="314" r="2.5" fill="#475569"/>
  </g>

  <!-- Technical Spec Watermark Badge on Panel -->
  <g transform="translate(85, 305)">
    <rect x="0" y="0" width="160" height="22" rx="4" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="8" y="15" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">WAAREE TOPCon BIFACIAL</text>
  </g>

  <g transform="translate(390, 305)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="10" y="15" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">550Wp • IEC 61215</text>
  </g>
</svg>
